questions:
- id: F01
  type: count
  question: How many 30-day passes were sold in September 2026?
  value: 8291
  unit: passes
  time_logic: sale_date in September
  tolerance: 0
  query: SELECT count(*) FROM fct_fare_sale WHERE product = 'month_pass' AND sale_date BETWEEN DATE '2026-09-01'
    AND DATE '2026-09-30'
- id: F02
  type: count
  question: How much pass revenue was taken in October 2026, in riyals?
  value: 1886850.0
  unit: SAR
  time_logic: sale_date in October
  tolerance: 0.5
  query: SELECT sum(price_sar) FROM fct_fare_sale WHERE sale_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
