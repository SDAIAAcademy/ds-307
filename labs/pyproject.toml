[project]
name = "ds-307-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course DS-307 Metrics, Semantic Models and Dashboards (case: Wadi Noor Transit)"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "hijridate>=2.5",
    "altair>=5.5",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false
