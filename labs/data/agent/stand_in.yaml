# The scripted stand-in of Nabih: for each certified question and configuration, the query the agent runs
# when no model key is set. Written to resemble errors that text-to-SQL agents make; it is NOT a recording
# of a model. The query is run for real by wnt_agent.Agent.
answers:
  Q01:
    raw:
      sql: SELECT count(*) FROM fct_boarding WHERE service_date BETWEEN '2026-09-01' AND '2026-09-30'
    semantic:
      metrics:
      - boardings.boardings
      where:
      - dates.gregorian_month = '2026-09'
  Q02:
    raw:
      sql: SELECT count(*) FROM fct_trip WHERE status = 'cancelled' AND month(service_date) = 10
    semantic:
      metrics:
      - trips.cancelled_trips
      where:
      - dates.gregorian_month = '2026-10'
  Q03:
    raw:
      sql: SELECT count(*) FROM fct_complaint WHERE received_date BETWEEN '2026-10-05' AND '2026-10-11'
    semantic:
      metrics:
      - complaints.complaints
      where:
      - dates.week_start = DATE '2026-10-04'
  Q04:
    raw:
      sql: SELECT count(*) FROM fct_trip WHERE route_id = 'R09' AND month(service_date) = 9
    semantic:
      metrics:
      - trips.departed_trips
      where:
      - routes.route_id = 'R09'
      - dates.gregorian_month = '2026-09'
  Q05:
    raw:
      sql: SELECT count(*) FROM fct_boarding b JOIN dim_route r USING (route_id) WHERE r.depot = 'East' AND month(b.service_date)
        = 8
    semantic:
      metrics:
      - boardings.boardings
      where:
      - routes.depot = 'East'
      - dates.gregorian_month = '2026-08'
  Q06:
    raw:
      sql: SELECT count(*) FROM fct_trip WHERE route_id = 'R07' AND strftime(service_date, '%Y-%m') = '2026-07'
    semantic:
      metrics:
      - trips.scheduled_trips
      where:
      - routes.route_id = 'R07'
      - dates.gregorian_month = '2026-07'
  Q07:
    raw:
      sql: SELECT count(*) FROM fct_complaint WHERE category = 'crowding' AND month(received_date) = 9
    semantic:
      metrics:
      - complaints.complaints
      where:
      - complaints.category = 'crowding'
      - dates.gregorian_month = '2026-09'
  Q08:
    raw:
      sql: SELECT count(*) FROM fct_boarding WHERE service_date = '2026-09-23'
    semantic:
      metrics:
      - boardings.boardings
      where:
      - dates.date = DATE '2026-09-23'
  Q09:
    raw:
      sql: SELECT avg((arr_delay_min <= 5)::INT) FROM fct_trip WHERE status <> 'cancelled' AND month(service_date)
        = 9
    semantic:
      metrics:
      - on_time_rate
      where:
      - dates.gregorian_month = '2026-09'
  Q10:
    raw:
      sql: SELECT avg(r) FROM (SELECT t.service_date, avg((t.dep_delay_min BETWEEN -1 AND 5)::INT) AS r FROM fct_trip
        t JOIN dim_route d USING (route_id) WHERE d.route_type = 'trunk' AND t.status <> 'cancelled' AND month(t.service_date)
        = 9 GROUP BY 1)
    semantic:
      metrics:
      - on_time_rate
      where:
      - routes.route_type = 'trunk'
      - dates.gregorian_month = '2026-09'
  Q11:
    raw:
      sql: SELECT avg((t.status = 'cancelled')::INT) FROM fct_trip t JOIN dim_route r USING (route_id) WHERE r.depot
        = 'East' AND month(t.service_date) = 10
    semantic:
      metrics:
      - cancellation_rate
      where:
      - routes.depot = 'East'
      - dates.gregorian_month = '2026-10'
  Q12:
    raw:
      sql: SELECT (SELECT count(*) FROM fct_boarding WHERE route_id = 'R01' AND service_date BETWEEN '2026-09-13'
        AND '2026-09-19') / (SELECT count(*) FROM fct_trip WHERE route_id = 'R01' AND service_date BETWEEN '2026-09-13'
        AND '2026-09-19')
    semantic:
      metrics:
      - boardings_per_departed_trip
      where:
      - routes.route_id = 'R01'
      - dates.week_start = DATE '2026-09-13'
  Q13:
    raw:
      sql: SELECT 10000.0 * count(c.complaint_id) / count(b.tap_id) FROM fct_boarding b LEFT JOIN fct_complaint
        c ON c.route_id = b.route_id AND c.received_date = b.service_date WHERE month(b.service_date) = 9
    semantic:
      metrics:
      - complaints_per_10k_boardings
      where:
      - dates.gregorian_month = '2026-09'
  Q14:
    raw:
      sql: SELECT sum((dep_delay_min BETWEEN -1 AND 5)::INT) / count(*) FROM fct_trip WHERE route_id = 'R04' AND
        status <> 'cancelled' AND month(service_date) = 10
    semantic:
      metrics:
      - on_time_rate
      where:
      - routes.route_id = 'R04'
      - dates.gregorian_month = '2026-10'
  Q15:
    raw:
      sql: SELECT avg((p.delay_min BETWEEN -1 AND 5)::INT) FROM fct_timepoint p JOIN fct_trip t USING (trip_id)
        WHERE t.route_id = 'R05' AND month(t.service_date) = 9
    semantic:
      metrics:
      - timepoint_on_time_rate
      where:
      - routes.route_id = 'R05'
      - dates.gregorian_month = '2026-09'
  Q16:
    raw:
      sql: SELECT avg(coalesce(dep_delay_min BETWEEN -1 AND 5, false)::INT) FROM fct_trip WHERE month(service_date)
        = 8
    semantic:
      metrics:
      - on_time_rate
      where:
      - dates.gregorian_month = '2026-08'
  Q17:
