  Q23:
    raw:
      sql: SELECT sum(c) FROM (SELECT d.week_start, count(DISTINCT b.card_id) AS c FROM fct_boarding b JOIN dim_date
        d ON d.date = b.service_date WHERE d.week_start BETWEEN '2026-09-06' AND '2026-09-27' GROUP BY 1)
    semantic:
      metrics:
      - boardings.unique_cards
      dimensions:
      - dates.week_start
      where:
      - dates.week_start BETWEEN DATE '2026-09-06' AND DATE '2026-09-27'
