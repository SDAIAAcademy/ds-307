- id: Q19
  type: distinct
  question: How many journeys were made in the week of 13 September 2026?
  value: 16231
  unit: journeys
  time_logic: Sunday 13 to Saturday 19 September; a tap within 60 minutes of the same card's previous tap is a transfer
  tolerance: 0
  query: SELECT sum(journey_start) FROM (SELECT *, CASE WHEN lag(tap_ts) OVER (PARTITION BY card_id ORDER BY tap_ts)
    >= tap_ts - INTERVAL 60 MINUTE THEN 0 ELSE 1 END AS journey_start FROM fct_boarding) WHERE service_date BETWEEN
    DATE '2026-09-13' AND DATE '2026-09-19'
