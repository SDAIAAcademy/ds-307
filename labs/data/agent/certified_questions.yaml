- id: Q09
  type: ratio
  question: What was the network on-time departure rate in September 2026?
  value: 0.806548
  unit: share of departed trips
  time_logic: service_date in September; on time is 1 minute early to 5 minutes late at the first timepoint
  tolerance: 0.001
  query: SELECT sum((status <> 'cancelled' AND dep_delay_min BETWEEN -1 AND 5)::INT) / sum((status <> 'cancelled')::INT)
    FROM fct_trip WHERE service_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
- id: Q10
  type: ratio
  question: What was the on-time departure rate of the trunk routes in September 2026?
  value: 0.669898
  unit: share of departed trips
  time_logic: service_date in September
  tolerance: 0.001
  query: SELECT sum((t.status <> 'cancelled' AND t.dep_delay_min BETWEEN -1 AND 5)::INT) / sum((t.status <> 'cancelled')::INT)
    FROM fct_trip t LEFT JOIN dim_route r ON r.route_id = t.route_id AND t.service_date >= r.valid_from AND (r.valid_to
    IS NULL OR t.service_date <= r.valid_to) WHERE r.route_type = 'trunk' AND t.service_date BETWEEN DATE '2026-09-01'
    AND DATE '2026-09-30'
