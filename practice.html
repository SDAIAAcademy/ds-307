<section>
<h2>Day 1: Define the numbers</h2>
<ol>
<li><p>Operations reports 80.7% and planning 66.0% for the same September, on the same warehouse, both with a tolerance of one minute early to five late. What explains most of the gap?</p><ul><li><b>A.</b> Planning reads a stale copy of the data</li><li><b>B.</b> Planning counts every timepoint arrival, where delays have built up</li><li><b>C.</b> Planning counts cancelled trips as late</li><li><b>D.</b> Planning reports a Hijri month</li></ul></li>
<li><p>Four drafts of "weekly riders". Which one could Muneer compute for any week and get the number you would get?</p><ul><li><b>A.</b> Distinct cards in fct_boarding per week</li><li><b>B.</b> COUNT(DISTINCT card_id)</li><li><b>C.</b> Riders who used the network last week, owned by planning</li><li><b>D.</b> COUNT(DISTINCT card_id) on fct_boarding, by service_date, weeks Sunday to Saturday</li></ul></li>
<li><p>A dashboard shows distinct cards per week. A manager wants the September total for a funding bid. What do you give?</p><ul><li><b>A.</b> A new distinct count over all of September's service dates</li><li><b>B.</b> The sum of the weekly figures</li><li><b>C.</b> The average of the weekly figures</li><li><b>D.</b> The largest weekly figure</li></ul></li>
<li><p>The tree is taps = scheduled trips × (1 − cancellation rate) × taps per departed trip. A colleague proposes adding "on-time rate" as a fourth driver. What do you say?</p><ul><li><b>A.</b> Add it: punctuality drives demand</li><li><b>B.</b> Replace the cancellation rate with it</li><li><b>C.</b> Keep it beside the tree, as a guardrail or its own goal</li><li><b>D.</b> Leave it out of the review</li></ul></li>
<li><p>Two reports on the same month agree on everything except one rule: report A leaves cancelled trips out, report B counts them as late. 3% of trips were cancelled. Which statement is true?</p><ul><li><b>A.</b> Report A is higher, because the cancelled trips, which can never be on time, are left out of its denominator</li><li><b>B.</b> Report B is higher, because it counts more trips</li><li><b>C.</b> The two figures are equal, because cancelled trips have no delay</li><li><b>D.</b> The reports cannot be compared, because they use different data</li></ul></li>
<li><p>The board pack labels its figure "September" but reports Rabi al-Thani 1448, which runs from 12 September to 11 October 2026. A manager compares it with a September figure from another report. What kind of difference is this?</p><ul><li><b>A.</b> A data quality difference</li><li><b>B.</b> A grain difference</li><li><b>C.</b> A tolerance difference</li><li><b>D.</b> A period difference</li></ul></li>
<li><p>Two dashboards show 81% and 66% on-time for the same week. Before you open the data, what do you compare first?</p><ul><li><b>A.</b> The colours and chart types of the two dashboards</li><li><b>B.</b> The number of users of each dashboard</li><li><b>C.</b> The written rules: grain, where measured, tolerance, filters and period</li><li><b>D.</b> The SQL engines the two dashboards run on</li></ul></li>
<li><p>Two analysts walk from the operations figure to the board figure, changing one rule at a time, in different orders. Their step sizes differ but both walks end on the board figure. What does this show?</p><ul><li><b>A.</b> One of the two analysts made an error</li><li><b>B.</b> The rules interact, so the size of each step depends on the order of the walk</li><li><b>C.</b> The board figure is not reproducible</li><li><b>D.</b> The walk should be done on a smaller sample</li></ul></li>
<li><p>A draft definition reads: "Weekly riders: COUNT(DISTINCT card_id), owner Planning." What must be added before it enters the catalogue?</p><ul><li><b>A.</b> A chart type and a colour</li><li><b>B.</b> The table and grain, the filters, the time logic with the week start, the unit, a named owner and the limits</li><li><b>C.</b> A target value for next year</li><li><b>D.</b> The SQL engine that will compute it</li></ul></li>
<li><p>In the week of 13 September the network recorded 19,826 taps and 9,864 distinct cards. A press officer writes "nearly 20,000 riders last week". What is wrong?</p><ul><li><b>A.</b> Taps count boardings: a rider who changes bus or returns taps several times</li><li><b>B.</b> Nothing: taps and riders are the same thing</li><li><b>C.</b> The figure should be rounded to 19,000</li><li><b>D.</b> Distinct cards should be multiplied by two</li></ul></li>
<li><p>Route A ran 100 trips with 90 on time; route B ran 10 with 5 on time. What is the on-time rate of the two routes together?</p><ul><li><b>A.</b> 70%</li><li><b>B.</b> 95 trips</li><li><b>C.</b> 90%</li><li><b>D.</b> 86.4%</li></ul></li>
<li><p>Weekly distinct cards for four weeks are 9,909, 9,864, 9,257 and 9,734. Which number is a valid count of distinct cards for the four weeks together?</p><ul><li><b>A.</b> 38,764, the sum of the weeks</li><li><b>B.</b> 9,909, the largest week</li><li><b>C.</b> A new distinct count over the four weeks of taps</li><li><b>D.</b> 9,691, the mean of the weeks</li></ul></li>
<li><p>The network tree is taps = scheduled trips × (1 − cancellation rate) × taps per departed trip. Planning wants to raise taps per departed trip by cutting frequency on busy routes. Which metric should the review watch as a guardrail?</p><ul><li><b>A.</b> Scheduled trips</li><li><b>B.</b> Taps</li><li><b>C.</b> Complaints per 10,000 taps</li><li><b>D.</b> The cancellation rate</li></ul></li>
<li><p>Active 30-day passes is a snapshot metric. How should its monthly value be defined?</p><ul><li><b>A.</b> The value on a stated day, such as the last day of the month, or the mean of the daily values</li><li><b>B.</b> The sum of the daily values</li><li><b>C.</b> The largest daily value</li><li><b>D.</b> The number of passes sold in the month</li></ul></li>
<li><p>Operations measures punctuality on departures from the first timepoint; planning on every timepoint arrival. Planning's figure is lower. What explains most of the gap?</p><ul><li><b>A.</b> Planning uses a different database</li><li><b>B.</b> Planning rounds its percentages down</li><li><b>C.</b> Delays build up along the route, so later timepoints are late more often</li><li><b>D.</b> Operations leaves out weekends</li></ul></li>
<li><p>The board report gives on-time for Rabi al-Thani 1448; operations gives it for September 2026. Before comparing the two numbers, what must the reconciliation state?</p><ul><li><b>A.</b> That the two periods cover different days, so one must be restated in the other calendar</li><li><b>B.</b> Nothing: both are about a month</li><li><b>C.</b> That the Hijri month is always shorter</li><li><b>D.</b> That the board report is wrong</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Model once</h2>
<ol>
<li><p>"journeys: SUM(journey_start) on boarding_linked; one card tap; filters none; unit journeys; owner Dhuha Al-Rowais, planning; limits: a quick return counts as a transfer." Which of the eight parts is missing?</p><ul><li><b>A.</b> The grain</li><li><b>B.</b> The owner</li><li><b>C.</b> The time logic</li><li><b>D.</b> The limits</li></ul></li>
<li><p>fct_timepoint has 329,188 rows, 82,000 distinct trip_id values and tp_seq from 1 to 4. What does one row mean?</p><ul><li><b>A.</b> One trip</li><li><b>B.</b> One timepoint of a route</li><li><b>C.</b> One scheduled minute of a trip</li><li><b>D.</b> One departed trip at one timepoint</li></ul></li>
<li><p>Three changes reach the route dimension this month. Which one needs a new version row?</p><ul><li><b>A.</b> Route R03 moves from the North to the Central depot</li><li><b>B.</b> A typo in the Arabic name of R06 is corrected</li><li><b>C.</b> The map colour of R10 changes</li><li><b>D.</b> The number of trips on R11 changes</li></ul></li>
<li><p>A report joins complaints and taps to routes in one query and counts both per route. Complaints come out about 7,000 times too high. What happened?</p><ul><li><b>A.</b> The complaints table has duplicate rows</li><li><b>B.</b> Each complaint was repeated once per tap of its route: two facts met through one dimension</li><li><b>C.</b> The date filter was left out</li><li><b>D.</b> The join should have been a left join</li></ul></li>
<li><p>You add cancellation_rate to the model. The trips dataset already has cancelled_trips and scheduled_trips. What do you write?</p><ul><li><b>A.</b> A dataset metric AVG(status = 'cancelled') on trips, used by every ratio</li><li><b>B.</b> A SQL snippet in each dashboard that needs it</li><li><b>C.</b> A model metric that averages a daily cancellation rate</li><li><b>D.</b> A model metric AGG(trips.cancelled_trips) / AGG(trips.scheduled_trips)</li></ul></li>
<li><p>fct_boarding has one row per card tap and a trip_id column. A colleague sums sched_minutes after joining trips to taps. What does the sum count?</p><ul><li><b>A.</b> Each trip's minutes once</li><li><b>B.</b> The minutes of the taps</li><li><b>C.</b> Only the minutes of trips without taps</li><li><b>D.</b> Each trip's minutes once per tap on it</li></ul></li>
<li><p>dim_route has 13 rows for 12 route_id values, because R07 has two versions. Which column should a relationship from a fact to dim_route use?</p><ul><li><b>A.</b> route_id, because riders use it</li><li><b>B.</b> route_key, the key of one version, found with the service date</li><li><b>C.</b> route_name_en, because it differs between the versions</li><li><b>D.</b> depot, because it never changes</li></ul></li>
<li><p>A route moves from the North depot to the Central depot on 1 November. How should the dimension record the change?</p><ul><li><b>A.</b> Overwrite the depot on the existing row</li><li><b>B.</b> Delete the route and create a new route_id</li><li><b>C.</b> Add a new row with a new key, valid from 1 November, and close the old row on 31 October</li><li><b>D.</b> Store the depot in the trips table only</li></ul></li>
<li><p>An as-of join reads "service_date BETWEEN valid_from AND valid_to". After it, every trip of the current versions has disappeared. Why?</p><ul><li><b>A.</b> The current versions have an empty valid_to, and BETWEEN with an empty bound is never true</li><li><b>B.</b> BETWEEN excludes its end dates</li><li><b>C.</b> The service dates are stored as text</li><li><b>D.</b> The current versions have no valid_from</li></ul></li>
<li><p>Planning wants to compare ridership in Ramadan 1447 with Ramadan of the year before. Which approach is right?</p><ul><li><b>A.</b> Compare March 2026 with March 2025</li><li><b>B.</b> Compare the first 30 days of each year</li><li><b>C.</b> Compare the totals of the two Gregorian quarters that contain Ramadan</li><li><b>D.</b> Compare taps per service day in the Hijri month Ramadan of each year, from the date dimension</li></ul></li>
<li><p>A query joins trips to taps and to timepoints in one statement and counts taps per route. The total is 3.98 times the source. What explains the factor?</p><ul><li><b>A.</b> Cancelled trips were counted</li><li><b>B.</b> Each tap is repeated by the number of timepoints its trip reached</li><li><b>C.</b> The taps table has duplicate rows</li><li><b>D.</b> The date filter was applied twice</li></ul></li>
<li><p>Which test would have caught the inflated route report before it was published?</p><ul><li><b>A.</b> Check that the sum of taps in the report equals a count of taps taken directly from fct_boarding for the same period</li><li><b>B.</b> Check that every route appears in the report</li><li><b>C.</b> Check that the report runs in under a second</li><li><b>D.</b> Check that the punctuality column is between 0 and 1</li></ul></li>
<li><p>In an Apache Ossie document, where does on_time_rate = on-time departures divided by departed trips belong?</p><ul><li><b>A.</b> In the routes dataset, because it is reported by route</li><li><b>B.</b> In the trips dataset, written as AVG(on_time)</li><li><b>C.</b> At the model root, written as AGG(trips.on_time_departures) / AGG(trips.departed_trips)</li><li><b>D.</b> In each dashboard that shows it</li></ul></li>
<li><p>The model's roles and field classifications are stored under nonportable_extensions. What happens when another tool imports the file?</p><ul><li><b>A.</b> Ossie enforces the rules in every tool that reads the file</li><li><b>B.</b> The tool must enforce the same rules, because Ossie carries the extension without interpreting it</li><li><b>C.</b> The rules are converted to SQL grants automatically</li><li><b>D.</b> The file fails validation in other tools</li></ul></li>
<li><p>Your 25 test queries all pass. Their expected values were produced by running the same semantic model last week. What does the result show?</p><ul><li><b>A.</b> That the model is correct</li><li><b>B.</b> That the warehouse is complete</li><li><b>C.</b> That the model is fast enough</li><li><b>D.</b> Only that the model has not changed since last week</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Show and investigate</h2>
<ol>
<li><p>A request asks for boardings.boardings and trips.departed_trips by routes.route_id for one week. Both facts reach routes. What SQL does the layer generate?</p><ul><li><b>A.</b> Join taps to trips, then group by route</li><li><b>B.</b> Aggregate each fact by route on its own, then join the two results on the route</li><li><b>C.</b> Average taps per trip, then multiply by trips</li><li><b>D.</b> Refuse: two facts cannot meet</li></ul></li>
<li><p>Your wireframe has seven panels and the limit is six. Mashael's decision is where reserve buses go next week. Which panel goes?</p><ul><li><b>A.</b> Revenue by fare product this month</li><li><b>B.</b> On-time departures by route against the target</li><li><b>C.</b> Taps per departed trip by route</li><li><b>D.</b> Cancellation rate by depot against last week</li></ul></li>
<li><p>The English crowding panel is finished. A colleague makes the Arabic one by translating the title and the axis label. What is still wrong?</p><ul><li><b>A.</b> The digits must become Eastern Arabic</li><li><b>B.</b> The numbers must be recomputed for Arabic readers</li><li><b>C.</b> The colours must change</li><li><b>D.</b> The route labels and the start of the bars must move to the right, with Arabic route names</li></ul></li>
<li><p>The dashboard shows on-time rate by route for any week and depot. You pre-aggregate to one row per route and day. Which columns do you store?</p><ul><li><b>A.</b> The daily on-time rate</li><li><b>B.</b> Every trip with its delay</li><li><b>C.</b> On-time departures and departed trips</li><li><b>D.</b> The weekly on-time rate, repeated on each day</li></ul></li>
<li><p>Route taps on the East depot fell by two thirds for four days. Taps on East buses did not fall. Every fare type lost its route in the same share. What do you conclude?</p><ul><li><b>A.</b> East riders moved to other routes</li><li><b>B.</b> A recording fault: the taps lost their route, not their riders</li><li><b>C.</b> A school holiday in the East</li><li><b>D.</b> East trips were cancelled</li></ul></li>
<li><p>A depot manager asks for "a dashboard for operations". What should you establish before choosing any panel?</p><ul><li><b>A.</b> Which chart library the team already uses</li><li><b>B.</b> Every metric the warehouse can compute</li><li><b>C.</b> Who will use it, which decision it serves and how often</li><li><b>D.</b> The colour palette of the organisation</li></ul></li>
<li><p>A panel shows "R11: 76% of departures on time". The director must decide whether R11 gets a reserve bus next week. Which comparison helps most?</p><ul><li><b>A.</b> The on-time rate of the whole year</li><li><b>B.</b> The number of stops on R11</li><li><b>C.</b> None: the figure speaks for itself</li><li><b>D.</b> R11's own level over the four weeks before</li></ul></li>
<li><p>The brief allows six panels. A seventh is proposed: the ten cards that tapped most last week. What do you do?</p><ul><li><b>A.</b> Leave it out: it does not serve the decision, and card numbers are Restricted</li><li><b>B.</b> Replace the on-time panel with it</li><li><b>C.</b> Add it with the card numbers shortened</li><li><b>D.</b> Add it, because it is interesting</li></ul></li>
<li><p>You build the Arabic version of a horizontal bar panel. Which change is required besides translating the text?</p><ul><li><b>A.</b> Sort the bars in the opposite order of values</li><li><b>B.</b> Mirror the panel: labels on the right and bars growing from the right</li><li><b>C.</b> Convert every digit to Eastern Arabic numerals</li><li><b>D.</b> Use a different colour for each bar</li></ul></li>
<li><p>A weekly panel shows complaints by subject. Accessibility has 3 complaints. The chart hides the bar, but the page embeds the full data. What is wrong?</p><ul><li><b>A.</b> The count can still be read from the page source; it must be removed from the data itself</li><li><b>B.</b> Nothing: the bar is hidden</li><li><b>C.</b> The threshold of 10 is too high for complaints</li><li><b>D.</b> Accessibility complaints should be merged into another subject</li></ul></li>
<li><p>A dashboard of 336 tiles sends one query per tile and takes 25 seconds. Each query takes about the same time. What will most reduce the load time?</p><ul><li><b>A.</b> Caching each tile's result after it is first viewed</li><li><b>B.</b> Fewer decimal places in each tile</li><li><b>C.</b> A faster laptop</li><li><b>D.</b> One grouped query that computes every tile, ideally from a table built at refresh time</li></ul></li>
<li><p>A route-day table feeds weekly and depot views of the on-time rate. Which columns must it store?</p><ul><li><b>A.</b> The weekly on-time rate</li><li><b>B.</b> The average delay of the day</li><li><b>C.</b> On-time departures and departed trips</li><li><b>D.</b> The daily on-time rate</li></ul></li>
<li><p>The new dashboard is 3,000 times faster, but 16 of 336 tiles show "empty" where the old one showed 0. What should happen before release?</p><ul><li><b>A.</b> Release: 95% of the tiles agree</li><li><b>B.</b> Fix the table so those route-days hold 0, and repeat the equality test</li><li><b>C.</b> Release, and note the difference in the footer</li><li><b>D.</b> Go back to the slow dashboard for good</li></ul></li>
<li><p>Route taps fell 17% in one week while all taps rose 2.5%. What is the best first conclusion?</p><ul><li><b>A.</b> Riders left the network</li><li><b>B.</b> Ridership moved to the weekend</li><li><b>C.</b> The 17% figure was computed wrongly</li><li><b>D.</b> Some taps lost their route attribution that week</li></ul></li>
<li><p>On four days, every fare type on East buses lost its route in exactly the same share. What does this point to?</p><ul><li><b>A.</b> A road closure on one route</li><li><b>B.</b> A recording fault on the East equipment</li><li><b>C.</b> A fare increase for adults</li><li><b>D.</b> A change in student travel</li></ul></li>
<li><p>You restate missing routes with an as-of join from each tap to the last trip of its bus. What should you do before publishing the restated week?</p><ul><li><b>A.</b> Compare the restated week with the same week last year</li><li><b>B.</b> Ask the depot to confirm the total by phone</li><li><b>C.</b> Run the same join on days where the trip is recorded and check it finds the recorded trip</li><li><b>D.</b> Nothing: the join is exact by construction</li></ul></li>
<li><p>Which line belongs in an anomaly note about the October drop?</p><ul><li><b>A.</b> Route taps fell 17% because of the validator update; restated, the week rose 2.5%</li><li><b>B.</b> Ridership data cannot be trusted</li><li><b>C.</b> The East depot team failed to check the validators</li><li><b>D.</b> The drop may be due to many factors</li></ul></li>
<li><p>The network on-time rate rose from August to September while every route type got less punctual. What do you check first?</p><ul><li><b>A.</b> Whether the data for August is complete</li><li><b>B.</b> The punctuality of each driver</li><li><b>C.</b> Whether the target changed</li><li><b>D.</b> How the number of trips of each route type changed between the two months</li></ul></li>
<li><p>A network pack shows a 17% drop in weekly ridership. Before drilling down, which check comes first?</p><ul><li><b>A.</b> Which depot fell most</li><li><b>B.</b> Whether the pack's count is the governed metric, and whether another count of the same taps agrees</li><li><b>C.</b> Last year's figure for the same week</li><li><b>D.</b> The weather of that week</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Let an agent answer</h2>
<ol>
<li><p>Route taps fell for four days on one depot. Which comparison tells you fastest whether riders left or the records lost their route?</p><ul><li><b>A.</b> Taps by the bus's depot against taps by the route's depot</li><li><b>B.</b> The weather on those days</li><li><b>C.</b> The same week last year</li><li><b>D.</b> Complaints on that depot's routes</li></ul></li>
<li><p>Nabih answers "80.4% of trips were on time in September". Its SQL ran without an error. The certified figure is 80.7% with a tolerance of 0.1 points. What do you mark?</p><ul><li><b>A.</b> Right: the query ran</li><li><b>B.</b> Right: it is close enough</li><li><b>C.</b> Wrong: it is outside the tolerance; read the query to find why</li><li><b>D.</b> Update the certified figure</li></ul></li>
<li><p>You certify "How many distinct cards tapped in the week of 13 September?" The answer is 9,864. What tolerance do you write?</p><ul><li><b>A.</b> 1% of the value</li><li><b>B.</b> 0: a count has one right answer</li><li><b>C.</b> None: the scorer decides</li><li><b>D.</b> Plus or minus 100</li></ul></li>
<li><p>In the semantic configuration, Nabih answers questions through governed metrics. Which error can still happen?</p><ul><li><b>A.</b> Measuring on time at the terminus</li><li><b>B.</b> Joining complaints to taps row by row</li><li><b>C.</b> Showing complaint text</li><li><b>D.</b> Reading "the week of 20 September" as starting on Monday 21</li></ul></li>
<li><p>With the semantic layer, distinct-card questions were 7 of 8 right; the wrong one summed weekly counts. The tolerance is 95% right without review. What do you decide?</p><ul><li><b>A.</b> Review: an analyst checks each figure before it is sent</li><li><b>B.</b> Answer alone: 7 of 8 is good</li><li><b>C.</b> Refuse the type</li><li><b>D.</b> Switch to the raw configuration for this type</li></ul></li>
<li><p>An agent's SQL runs without an error and returns 60.7% for September punctuality. The certified figure is 80.7%. What does the clean run show?</p><ul><li><b>A.</b> Only that the SQL is valid; it may compute another measure</li><li><b>B.</b> That the agent's answer is right</li><li><b>C.</b> That the certified figure is out of date</li><li><b>D.</b> That the warehouse has missing rows</li></ul></li>
<li><p>You will score an agent on 40 questions. Which record of each answer lets you diagnose its errors afterwards?</p><ul><li><b>A.</b> The time each answer took</li><li><b>B.</b> The final sentence the agent wrote</li><li><b>C.</b> The query it ran, the configuration, the model or stand-in, and the value</li><li><b>D.</b> A screenshot of the chat</li></ul></li>
<li><p>Which entry is a complete certified answer?</p><ul><li><b>A.</b> "15.82 taps per trip" with the analyst's name</li><li><b>B.</b> Value 15.816327, the query that produced it, Sunday 13 to Saturday 19 September, tolerance 0.001</li><li><b>C.</b> The semantic layer's answer to the same question</li><li><b>D.</b> "Taps per trip on R01, week of 13 September: about 16"</li></ul></li>
<li><p>A depot manager asks Nabih: "How many complaints mention a wheelchair?" What is the certified answer?</p><ul><li><b>A.</b> The count from a text search of complaint_text</li><li><b>B.</b> The count of accessibility complaints</li><li><b>C.</b> Zero, because no metric exists</li><li><b>D.</b> A refusal: answering requires reading the Restricted complaint text</li></ul></li>
<li><p>With the semantic layer, Nabih answered "the week of Sunday 20 September" by filtering week_start = 21 September and returned 0 taps. What kind of error is it?</p><ul><li><b>A.</b> A period error in reading the question, which the layer cannot catch by itself</li><li><b>B.</b> A definition error the layer should have prevented</li><li><b>C.</b> A join error</li><li><b>D.</b> A leak</li></ul></li>
<li><p>Two wrong answers: 5,394 complaints per 10,000 taps (certified 27.0) and 67.1% trunk punctuality (certified 67.0%). Which is more dangerous, and why?</p><ul><li><b>A.</b> Neither, because both would be caught in review</li><li><b>B.</b> The first, because it is further from the truth</li><li><b>C.</b> Both equally, because both are wrong</li><li><b>D.</b> The second, because a reader would believe it and act on it</li></ul></li>
<li><p>Ratio questions were 8 of 8 right with the semantic layer. The tolerance is 95% right without review. What should the memo say?</p><ul><li><b>A.</b> Review every ratio answer forever</li><li><b>B.</b> Refuse ratio questions until the model improves</li><li><b>C.</b> Answer provisionally: 8 of 8 is consistent with an accuracy as low as 75%; grow the set to 30 and re-test</li><li><b>D.</b> The agent is 100% accurate on ratios</li></ul></li>
<li><p>The raw configuration got 18 of 40 right and answered four Restricted questions from Restricted fields, twice showing complaint text with phone numbers. What does the memo decide for it?</p><ul><li><b>A.</b> Use it for count questions, where it scored 6 of 8</li><li><b>B.</b> Do not use it: the leaks break the zero tolerance for Restricted data, whatever its accuracy</li><li><b>C.</b> Use it with a stronger instruction</li><li><b>D.</b> Use it for questions the semantic layer cannot answer</li></ul></li>
</ol>

wner"},{"key":"C","text":"The time logic"},{"key":"D","text":"The limits"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Nothing says which date places a tap in a period, or which week and calendar apply, so two analysts could still report two numbers for \"last week\".","misconceptions":["The grain is there: one card tap","The owner is a named person with a role","","The limits line names a known undercount"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which part of the definition is missing?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"fct_timepoint has 329,188 rows, 82,000 distinct trip_id values and tp_seq from 1 to 4. What does one row mean?","options":[{"key":"A","text":"One trip"},{"key":"B","text":"One timepoint of a route"},{"key":"C","text":"One scheduled minute of a trip"},{"key":"D","text":"One departed trip at one timepoint"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The key is (trip_id, tp_seq): rows equal distinct pairs, so one row is a trip's arrival at one of its four timepoints.","misconceptions":["Trusts the trip_id column over the row count: there are four times more rows than trips","Timepoints are fixed places on a route; the table records arrivals, not places","Arrivals are per trip, not per scheduled minute",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"What is the grain of the timepoint table?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Three changes reach the route dimension this month. Which one needs a new version row?","options":[{"key":"A","text":"Route R03 moves from the North to the Central depot"},{"key":"B","text":"A typo in the Arabic name of R06 is corrected"},{"key":"C","text":"The map colour of R10 changes"},{"key":"D","text":"The number of trips on R11 changes"}],"correct":[0],"answer":null,"tolerance":nu d not fall","","A holiday would cut taps on the buses too, and would hit students more than adults","Cancelled trips carry no taps at all; the taps exist, only without a route"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"checkpoint-4","title":"Data or demand?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Route taps fell for four days on one depot. Which comparison tells you fastest whether riders left or the records lost their route?","options":[{"key":"A","text":"Taps by the bus's depot against taps by the route's depot"},{"key":"B","text":"The weather on those days"},{"key":"C","text":"The same week last year"},{"key":"D","text":"Complaints on that depot's routes"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A tap keeps its bus when it loses its route: if bus counts hold while route counts fall, the riders are there and the records are not.","misconceptions":["","The weather explains demand, not a gap between two counts of the same taps","Last year's week differs for many reasons and cannot separate the two","Complaints may move with service, but they do not tell which taps lost their route"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which cut separates data from demand?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Nabih answers \"80.4% of trips were on time in September\". Its SQL ran without an error. The certified figure is 80.7% with a tolerance of 0.1 points. What do you mark?","options":[{"key":"A","text":"Right: the query ran"},{"key":"B","text":"Right: it is close enough"},{"key":"C","text":"Wrong: it is outside the tolerance; read the query to find why"},{"key":"D","text":"Update the certified figure"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"0.3 points is outside the 0.1-point tolerance; the query shows which definition, period or grain the agent used." ual, because cancelled trips have no delay"},{"key":"D","text":"The reports cannot be compared, because they use different data"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Counting a cancelled trip as late adds trips that can never be on time, so report B is lower than A.","misconceptions":["","A larger denominator lowers a share when the added rows all fail","A cancelled trip has no delay, but B still counts it in the denominator","Both reports read the same rows; only the rule differs"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-hijri-period","type":"single","prompt":"The board pack labels its figure \"September\" but reports Rabi al-Thani 1448, which runs from 12 September to 11 October 2026. A manager compares it with a September figure from another report. What kind of difference is this?","options":[{"key":"A","text":"A data quality difference"},{"key":"B","text":"A grain difference"},{"key":"C","text":"A tolerance difference"},{"key":"D","text":"A period difference"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The two figures cover different dates, so the period differs even before any rule is compared.","misconceptions":["The rows are correct; they are simply selected by another calendar","The grain is what one counted row is; both count trips","Tolerance is how early or late counts as on time, not which dates are included",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-first-question","type":"single","prompt":"Two dashboards show 81% and 66% on-time for the same week. Before you open the data, what do you compare first?","options":[{"key":"A","text":"The colours and chart types of the two dashboards"},{"key":"B","text":"The number of users of each dashboard"},{"key":"C","text":"The written rules: grain, where measured, tolerance, filters and period"},{"key":"D","text":"The SQL engines the two dashboards run on"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Most disagreements between figures on one warehouse are definitional; the rules locate the cause before any debugging.","misconceptions":["The presentation does not change the number","Popularity says nothing about which rule was used","","Two engines return the same answer to the same query; the queries differ"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-walk-order","type":"single","prompt":"Two analysts walk from the operations figure to the board figure, changing one rule at a time, in different orders. Their step sizes differ but both walks end on the board figure. What does this show?","options":[{"key":"A","text":"One of the two analysts made an error"},{"key":"B","text":"The rules interact, so the size of each step depends on the order of the walk"},{"key":"C","text":"The board figure is not reproducible"},{"key":"D","text":"The walk should be done on a smaller sample"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Rules such as the tolerance and the point measured interact, so each step depends on the steps before it; state the order with the walk.","misconceptions":["Both walks reach the same end point, so neither is wrong","","Both walks reproduce it exactly","Sampling would add noise; it does not remove the interaction"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d1-definition-parts","type":"single","prompt":"A draft definition reads: \"Weekly riders: COUNT(DISTINCT card_id), owner Planning.\" What must be added before it enters the catalogue?","options":[{"key":"A","text":"A chart type and a colour"},{"key":"B","text":"The table and grain, the filters, the time logic with the week start, the unit, a named owner and the limits"},{"key":"C","text":"A target value for next year"},{"key":"D","text":"The SQL engine that will compute it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A colleague must be able to compute the same number from the definition alone: grain, filters, time logic, unit, a person as owner and limits.","misconceptions":["Presentation belongs to the dashboard, not to the metric","","A target is a decision about the metric, not part of its meaning","The definition must give the same number on any engine"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-taps-vs-cards","type":"single","prompt":"In the week of 13 September the network recorded 19,826 taps and 9,864 distinct cards. A press officer writes \"nearly 20,000 riders last week\". What is wrong?","options":[{"key":"A","text":"Taps count boardings: a rider who changes bus or returns taps several times"},{"key":"B","text":"Nothing: taps and riders are the same thing"},{"key":"C","text":"The figure should be rounded to 19,000"},{"key":"D","text":"Distinct cards should be multiplied by two"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A tap is a boarding; one person makes several in a week, so taps overstate people. Unique cards is the nearest count, and a card is still not a person.","misconceptions":["","Confuses the counting unit (a boarding) with a person","Rounding does not fix a wrong unit","There is no fixed number of taps per rider"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-ratio-of-sums","type":"single","prompt":"Route A ran 100 trips with 90 on time; route B ran 10 with 5 on time. What is the on-time rate of the two routes together?","options":[{"key":"A","text":"70%"},{"key":"B","text":"95 trips"},{"key":"C","text":"90%"},{"key":"D","text":"86.4%"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The network rate is a ratio of sums: 95 on-time trips over 110 departed trips, 86.4%.","misconceptions":["Averages the two route rates, giving the small route the weight of the large one","A count of trips is not a rate","Takes the larger route only",""],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-distinct-weeks","type":"single","prompt":"Weekly distinct cards for four weeks are 9,909, 9,864, 9,257 and 9,734. Which number is a valid count of distinct cards for the four weeks together?","options":[{"key":"A","text":"38,764, the sum of the weeks"},{"key":"B","text":"9,909, the largest week"},{"key":"C","text":"A new distinct count over the four weeks of taps"},{"key":"D","text":"9,691, the mean of the weeks"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Distinct counts are not additive across periods; the count must be computed again over the whole period (22,962 in the lab).","misconceptions":["Cards that travel every week are counted once per week","Cards seen only in other weeks are missed","","A mean is a typical week, not the period"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-tree-guardrail","type":"single","prompt":"The network tree is taps = scheduled trips × (1 − cancellation rate) × taps per departed trip. Planning wants to raise taps per departed trip by cutting frequency on busy routes. Which metric should the review watch as a guardrail?","options":[{"key":"A","text":"Scheduled trips"},{"key":"B","text":"Taps"},{"key":"C","text":"Complaints per 10,000 taps"},{"key":"D","text":"The cancellation rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Crowding more riders onto fewer buses can raise taps per trip while riders suffer; complaints per 10,000 taps watches for that harm.","misconceptions":["It is a driver of the tree, and the plan lowers it on purpose","It is the goal itself, not a check on harm","","Cutting frequency does not cancel trips; the rate need not move"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d1-snapshot","type":"single","prompt":"Active 30-day passes is a snapshot metric. How should its monthly value be defined?","options":[{"key":"A","text":"The value on a stated day, such as the last day of the month, or the mean of the daily values"},{"key":"B","text":"The sum of the daily values"},{"key":"C","text":"The largest daily value"},{"key":"D","text":"The number of passes sold in the month"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A snapshot is a state on a date; it is never summed over days, so the time logic must name the day or the averaging.","misconceptions":["","Summing a state over days counts each pass once per day it is active","The peak is a different metric with its own name","Sales are a flow, a different metric"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-grain-boardings","type":"single","prompt":"fct_boarding has one row per card tap and a trip_id column. A colleague sums sched_minutes after joining trips to taps. What does the sum count?","options":[{"key":"A","text":"Each trip's minutes once"},{"key":"B","text":"The minutes of the taps"},{"key":"C","text":"Only the minutes of trips without taps"},{"key":"D","text":"Each trip's minutes once per tap on it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"After the join each trip appears once per tap, so a trip column summed over the joined rows is repeated by the number of taps.","misconceptions":["Forgets that joining to the many side repeats the one side","Taps have no duration; the minutes belong to trips","An inner join drops trips without taps rather than keeping only them",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-surrogate-key","type":"single","prompt":"dim_route has 13 rows for 12 route_id values, because R07 has two versions. Which column should a relationship from a fact to dim_route use?","options":[{"key":"A","text":"route_id, because riders use it"},{"key":"B","text":"route_key, the key of one version, found with the service date"},{"key":"C","text":"route_name_en, because it differs between the versions"},{"key":"D","text":"depot, because it never changes"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"route_key identifies one version; facts reach it through an as-of join on the service date, so each fact row meets exactly one dimension row.","misconceptions":["A natural key with history is not unique: R07 rows would double","","Names can repeat and can change without a new version","A depot is shared by four routes: not a key"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-type2","type":"single","prompt":"A route moves from the North depot to the Central depot on 1 November. How should the dimension record the change?","options":[{"key":"A","text":"Overwrite the depot on the existing row"},{"key":"B","text":"Delete the route and create a new route_id"},{"key":"C","text":"Add a new row with a new key, valid from 1 November, and close the old row on 31 October"},{"key":"D","text":"Store the depot in the trips table only"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A real change that past figures must not inherit is type 2: a new version with its own validity dates.","misconceptions":["Type 1 rewrites history: North would lose its past trips","A new route_id breaks every comparison over time for the same route","","Moves a dimension attribute into the fact, repeated on every trip"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-asof-null","type":"single","prompt":"An as-of join reads \"service_date BETWEEN valid_from AND valid_to\". After it, every trip of the current versions has disappeared. Why?","options":[{"key":"A","text":"The current versions have an empty valid_to, and BETWEEN with an empty bound is never true"},{"key":"B","text":"BETWEEN excludes its end dates"},{"key":"C","text":"The service dates are stored as text"},{"key":"D","text":"The current versions have no valid_from"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An open valid_to means \"still valid\"; the condition needs \"valid_to IS NULL OR service_date \u003c= valid_to\".","misconceptions":["","BETWEEN includes both ends in SQL","Text dates would fail differently, for all versions alike","Every version has a start date"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-hijri-compare","type":"single","prompt":"Planning wants to compare ridership in Ramadan 1447 with Ramadan of the year before. Which approach is right?","options":[{"key":"A","text":"Compare March 2026 with March 2025"},{"key":"B","text":"Compare the first 30 days of each year"},{"key":"C","text":"Compare the totals of the two Gregorian quarters that contain Ramadan"},{"key":"D","text":"Compare taps per service day in the Hijri month Ramadan of each year, from the date dimension"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Ramadan moves about eleven days earlier each Gregorian year; the Hijri month in the date dimension selects the same period, and per-day figures remove month length.","misconceptions":["March of each year holds different parts of Ramadan, or none","The start of the year is unrelated to Ramadan","A quarter mixes Ramadan with ordinary weeks",""],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-fan-trap","type":"single","prompt":"A query joins trips to taps and to timepoints in one statement and counts taps per route. The total is 3.98 times the source. What explains the factor?","options":[{"key":"A","text":"Cancelled trips were counted"},{"key":"B","text":"Each tap is repeated by the number of timepoints its trip reached"},{"key":"C","text":"The taps table has duplicate rows"},{"key":"D","text":"The date filter was applied twice"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Two many sides met through one trip, so every tap is paired with every timepoint of its trip: four, or two for a partial trip.","misconceptions":["Cancelled trips have no taps and no timepoints","","Duplicates would not follow the number of timepoints","Applying a filter twice changes nothing"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-reconcile","type":"single","prompt":"Which test would have caught the inflated route report before it was published?","options":[{"key":"A","text":"Check that the sum of taps in the report equals a count of taps taken directly from fct_boarding for the same period"},{"key":"B","text":"Check that every route appears in the report"},{"key":"C","text":"Check that the report runs in under a second"},{"key":"D","text":"Check that the punctuality column is between 0 and 1"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A reconciliation test compares a report total with the source counted another way; the inflated report fails it at once.","misconceptions":["","All routes appear in the inflated report too","Speed says nothing about correctness","The inflated punctuality is still between 0 and 1"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-model-scope","type":"single","prompt":"In an Apache Ossie document, where does on_time_rate = on-time departures divided by departed trips belong?","options":[{"key":"A","text":"In the routes dataset, because it is reported by route"},{"key":"B","text":"In the trips dataset, written as AVG(on_time)"},{"key":"C","text":"At the model root, written as AGG(trips.on_time_departures) / AGG(trips.departed_trips)"},{"key":"D","text":"In each dashboard that shows it"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A metric that combines aggregated dataset metrics is model-scoped and reads them with AGG(), so the division happens after aggregation.","misconceptions":["Grouping by route does not move a trip metric into the route dataset","A mean of a per-trip flag hides the governed parts and does not generalise to other ratios","","Copies the definition into every consumer"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-extension","type":"single","prompt":"The model's roles and field classifications are stored under nonportable_extensions. What happens when another tool imports the file?","options":[{"key":"A","text":"Ossie enforces the rules in every tool that reads the file"},{"key":"B","text":"The tool must enforce the same rules, because Ossie carries the extension without interpreting it"},{"key":"C","text":"The rules are converted to SQL grants automatically"},{"key":"D","text":"The file fails validation in other tools"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The specification defines no access rules; vendor extensions travel with the model but each consumer must implement them.","misconceptions":["Ossie is a file format, not an engine that enforces anything","","No converter turns a vendor extension into grants by itself","Extensions are valid Ossie; other tools simply ignore them"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-independent-reference","type":"single","prompt":"Your 25 test queries all pass. Their expected values were produced by running the same semantic model last week. What does the result show?","options":[{"key":"A","text":"That the model is correct"},{"key":"B","text":"That the warehouse is complete"},{"key":"C","text":"That the model is fast enough"},{"key":"D","text":"Only that the model has not changed since last week"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A reference produced by the system under test proves only agreement with itself; references must come from independent SQL.","misconceptions":["Agreement with an earlier run of itself cannot detect a definition that was wrong from the start","Tests on a model say nothing about missing source rows","Correctness tests do not measure speed",""],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-decision-first","type":"single","prompt":"A depot manager asks for \"a dashboard for operations\". What should you establish before choosing any panel?","options":[{"key":"A","text":"Which chart library the team already uses"},{"key":"B","text":"Every metric the warehouse can compute"},{"key":"C","text":"Who will use it, which decision it serves and how often"},{"key":"D","text":"The colour palette of the organisation"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Audience, decision and cadence decide which questions belong; without them every question qualifies and the page fills up.","misconceptions":["Tools follow the design; they do not decide what to show","Showing everything the warehouse holds is a report, not a decision dashboard","","Colours matter later; they do not choose panels"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-comparison","type":"single","prompt":"A panel shows \"R11: 76% of departures on time\". The director must decide whether R11 gets a reserve bus next week. Which comparison helps most?","options":[{"key":"A","text":"The on-time rate of the whole year"},{"key":"B","text":"The number of stops on R11"},{"key":"C","text":"None: the figure speaks for itself"},{"key":"D","text":"R11's own level over the four weeks before"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A reserve bus fixes an unusual week; R11's usual level (86%) shows that last week was unusual for this route.","misconceptions":["A yearly figure mixes seasons and timetable changes and moves too slowly to flag one week","Stops explain a timetable, not whether last week was unusual","A number alone does not say whether to act",""],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-cut-panel","type":"single","prompt":"The brief allows six panels. A seventh is proposed: the ten cards that tapped most last week. What do you do?","options":[{"key":"A","text":"Leave it out: it does not serve the decision, and card numbers are Restricted"},{"key":"B","text":"Replace the on-time panel with it"},{"key":"C","text":"Add it with the card numbers shortened"},{"key":"D","text":"Add it, because it is interesting"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The panel serves no part of the reserve-bus decision, and grouping by card number exposes a Restricted field.","misconceptions":["","The on-time panel is a direct input of the decision","Shortened card numbers are still personal data grouped and shown","Interest is not a reason to take space from the decision"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-rtl","type":"single","prompt":"You build the Arabic version of a horizontal bar panel. Which change is required besides translating the text?","options":[{"key":"A","text":"Sort the bars in the opposite order of values"},{"key":"B","text":"Mirror the panel: labels on the right and bars growing from the right"},{"key":"C","text":"Convert every digit to Eastern Arabic numerals"},{"key":"D","text":"Use a different colour for each bar"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A right-to-left reader starts at the right; labels and the start of each bar belong there.","misconceptions":["The order of values carries meaning and does not depend on the language","","The Academy keeps Western digits in Arabic material; digits are not the layout problem","Colour does not set the reading direction"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-suppress","type":"single","prompt":"A weekly panel shows complaints by subject. Accessibility has 3 complaints. The chart hides the bar, but the page embeds the full data. What is wrong?","options":[{"key":"A","text":"The count can still be read from the page source; it must be removed from the data itself"},{"key":"B","text":"Nothing: the bar is hidden"},{"key":"C","text":"The threshold of 10 is too high for complaints"},{"key":"D","text":"Accessibility complaints should be merged into another subject"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A dashboard page ships its data; suppression must remove the value from the data, not only from the drawing.","misconceptions":["","Hiding the mark leaves the value readable in the embedded specification","The threshold is set by the model's owner; the problem is where the value still lives","Merging subjects changes the meaning of the panel to hide a number"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-n-plus-one","type":"single","prompt":"A dashboard of 336 tiles sends one query per tile and takes 25 seconds. Each query takes about the same time. What will most reduce the load time?","options":[{"key":"A","text":"Caching each tile's result after it is first viewed"},{"key":"B","text":"Fewer decimal places in each tile"},{"key":"C","text":"A faster laptop"},{"key":"D","text":"One grouped query that computes every tile, ideally from a table built at refresh time"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The cost is in repeating the same work 336 times; one grouped query does it once, and a refresh-time table moves it out of view time.","misconceptions":["The first view of every tile is still slow, and every refresh starts again","Formatting is not where the time goes","A faster machine shrinks each query a little but keeps all 336",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-keep-parts","type":"single","prompt":"A route-day table feeds weekly and depot views of the on-time rate. Which columns must it store?","options":[{"key":"A","text":"The weekly on-time rate"},{"key":"B","text":"The average delay of the day"},{"key":"C","text":"On-time departures and departed trips"},{"key":"D","text":"The daily on-time rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The two counts add across days, routes and depots, so any grouping is a ratio of sums; a stored rate cannot be re-aggregated.","misconceptions":["A weekly figure cannot serve daily or depot views","An average delay is a different metric from the on-time rate","","Averaging daily rates gives light days the same weight as busy ones"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-equality","type":"single","prompt":"The new dashboard is 3,000 times faster, but 16 of 336 tiles show \"empty\" where the old one showed 0. What should happen before release?","options":[{"key":"A","text":"Release: 95% of the tiles agree"},{"key":"B","text":"Fix the table so those route-days hold 0, and repeat the equality test"},{"key":"C","text":"Release, and note the difference in the footer"},{"key":"D","text":"Go back to the slow dashboard for good"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A faster dashboard must show the same numbers; the difference has a cause (no tap with a route) and a fix (store 0).","misconceptions":["A partial match still shows wrong figures on some tiles","","A footer note leaves the wrong tiles in front of the reader","The fix is small; the speed gain is kept once the tiles agree"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-confirm","type":"single","prompt":"Route taps fell 17% in one week while all taps rose 2.5%. What is the best first conclusion?","options":[{"key":"A","text":"Riders left the network"},{"key":"B","text":"Ridership moved to the weekend"},{"key":"C","text":"The 17% figure was computed wrongly"},{"key":"D","text":"Some taps lost their route attribution that week"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The taps exist; they are missing only from the count grouped by route, so attribution, not ridership, changed.","misconceptions":["If riders had left, all taps would fall too","A shift between days changes neither weekly count","The 17% is correct for taps with a route; it measures something else",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-segment","type":"single","prompt":"On four days, every fare type on East buses lost its route in exactly the same share. What does this point to?","options":[{"key":"A","text":"A road closure on one route"},{"key":"B","text":"A recording fault on the East equipment"},{"key":"C","text":"A fare increase for adults"},{"key":"D","text":"A change in student travel"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A real change in demand hits segments unevenly; an equal loss across all of them points at the equipment.","misconceptions":["A road closure affects one route, not every bus of a depot","","A fare change would hit one fare type and would reduce taps, not routes","Students alone would move, not every fare type"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-validate-restatement","type":"single","prompt":"You restate missing routes with an as-of join from each tap to the last trip of its bus. What should you do before publishing the restated week?","options":[{"key":"A","text":"Compare the restated week with the same week last year"},{"key":"B","text":"Ask the depot to confirm the total by phone"},{"key":"C","text":"Run the same join on days where the trip is recorded and check it finds the recorded trip"},{"key":"D","text":"Nothing: the join is exact by construction"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A restatement is a model of missing data; it is trusted once it reproduces data you already have.","misconceptions":["Last year's week differs for many reasons and cannot validate the join","A phoned total is not evidence about each tap","","An early tap or a delayed trip can attach a tap to the wrong trip"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-note","type":"single","prompt":"Which line belongs in an anomaly note about the October drop?","options":[{"key":"A","text":"Route taps fell 17% because of the validator update; restated, the week rose 2.5%"},{"key":"B","text":"Ridership data cannot be trusted"},{"key":"C","text":"The East depot team failed to check the validators"},{"key":"D","text":"The drop may be due to many factors"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A note states what was seen, the cause, the size and the change, with numbers and without blame.","misconceptions":["","A general distrust gives the reader nothing to act on","Blame does not prevent the next fault; a test does","A vague cause is not a finding"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-ran-is-not-right","type":"single","prompt":"An agent's SQL runs without an error and returns 60.7% for September punctuality. The certified figure is 80.7%. What does the clean run show?","options":[{"key":"A","text":"Only that the SQL is valid; it may compute another measure"},{"key":"B","text":"That the agent's answer is right"},{"key":"C","text":"That the certified figure is out of date"},{"key":"D","text":"That the warehouse has missing rows"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Valid SQL can measure another event, period or grain; only the comparison with the certified figure tells right from wrong.","misconceptions":["","Confuses a query that runs with a query that answers the governed question","The certified figure was computed from the same warehouse with the governed definition","Missing rows would show in both figures, not only in the agent's"],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-log","type":"single","prompt":"You will score an agent on 40 questions. Which record of each answer lets you diagnose its errors afterwards?","options":[{"key":"A","text":"The time each answer took"},{"key":"B","text":"The final sentence the agent wrote"},{"key":"C","text":"The query it ran, the configuration, the model or stand-in, and the value"},{"key":"D","text":"A screenshot of the chat"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The query shows which definition, period and grain were used; the mode and configuration say how the answer was produced.","misconceptions":["Timing says nothing about correctness","A sentence hides the definition the query used","","A screenshot cannot be scored or searched"],"lo":["LO6"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-certified","type":"single","prompt":"Which entry is a complete certified answer?","options":[{"key":"A","text":"\"15.82 taps per trip\" with the analyst's name"},{"key":"B","text":"Value 15.816327, the query that produced it, Sunday 13 to Saturday 19 September, tolerance 0.001"},{"key":"C","text":"The semantic layer's answer to the same question"},{"key":"D","text":"\"Taps per trip on R01, week of 13 September: about 16\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A certified answer can be rerun and judged: value, query, time logic and a tolerance set in advance.","misconceptions":["A name does not let anyone rerun or check the figure","","An answer from the system under test cannot certify that system","\"About\" is not a value an agent can be scored against"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-refusal","type":"single","prompt":"A depot manager asks Nabih: \"How many complaints mention a wheelchair?\" What is the certified answer?","options":[{"key":"A","text":"The count from a text search of complaint_text"},{"key":"B","text":"The count of accessibility complaints"},{"key":"C","text":"Zero, because no metric exists"},{"key":"D","text":"A refusal: answering requires reading the Restricted complaint text"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The question can only be answered by reading Restricted text, so the right behaviour is to decline and say why.","misconceptions":["Reads Restricted text to produce a count","Answers a different question than the one asked","Inventing a figure is wrong even when it is zero",""],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-layer-limits","type":"single","prompt":"With the semantic layer, Nabih answered \"the week of Sunday 20 September\" by filtering week_start = 21 September and returned 0 taps. What kind of error is it?","options":[{"key":"A","text":"A period error in reading the question, which the layer cannot catch by itself"},{"key":"B","text":"A definition error the layer should have prevented"},{"key":"C","text":"A join error"},{"key":"D","text":"A leak"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The layer governs metrics, joins and access; the agent still reads the period, and here read it wrongly.","misconceptions":["","The metric used was the governed one","No join repeated rows: the filter matched no week","No Restricted field was involved"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-plausible","type":"single","prompt":"Two wrong answers: 5,394 complaints per 10,000 taps (certified 27.0) and 67.1% trunk punctuality (certified 67.0%). Which is more dangerous, and why?","options":[{"key":"A","text":"Neither, because both would be caught in review"},{"key":"B","text":"The first, because it is further from the truth"},{"key":"C","text":"Both equally, because both are wrong"},{"key":"D","text":"The second, because a reader would believe it and act on it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An absurd figure is caught by any reader; a plausible one passes into decisions unnoticed.","misconceptions":["Review is the decision being made; it cannot be assumed","Distance from the truth matters less than whether anyone notices","Wrong answers differ in the harm they do",""],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-interval","type":"single","prompt":"Ratio questions were 8 of 8 right with the semantic layer. The tolerance is 95% right without review. What should the memo say?","options":[{"key":"A","text":"Review every ratio answer forever"},{"key":"B","text":"Refuse ratio questions until the model improves"},{"key":"C","text":"Answer provisionally: 8 of 8 is consistent with an accuracy as low as 75%; grow the set to 30 and re-test"},{"key":"D","text":"The agent is 100% accurate on ratios"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Eight questions cannot prove 95%; the decision stands while a larger test confirms or withdraws it.","misconceptions":["Ignores the evidence that the type performed well","Closes a type that showed no error","","Reports a sample result as a certainty"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-raw-config","type":"single","prompt":"The raw configuration got 18 of 40 right and answered four Restricted questions from Restricted fields, twice showing complaint text with phone numbers. What does the memo decide for it?","options":[{"key":"A","text":"Use it for count questions, where it scored 6 of 8"},{"key":"B","text":"Do not use it: the leaks break the zero tolerance for Restricted data, whatever its accuracy"},{"key":"C","text":"Use it with a stronger instruction"},{"key":"D","text":"Use it for questions the semantic layer cannot answer"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Restricted data has a zero tolerance; a configuration that leaked cannot be used for any type.","misconceptions":["6 of 8 is also below the 95% tolerance, and the leaks remain","","An instruction is a request to the model, not an enforced rule","Questions outside the layer are the ones most likely to be invented or leaked"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-x-timepoint-grain","type":"single","prompt":"Operations measures punctuality on departures from the first timepoint; planning on every timepoint arrival. Planning's figure is lower. What explains most of the gap?","options":[{"key":"A","text":"Planning uses a different database"},{"key":"B","text":"Planning rounds its percentages down"},{"key":"C","text":"Delays build up along the route, so later timepoints are late more often"},{"key":"D","text":"Operations leaves out weekends"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The two figures count different events: an arrival at the fourth timepoint carries the delay gathered on the way, a departure does not.","misconceptions":["Both read the same warehouse; the difference is in the definition","Rounding cannot move a figure by many points","","Nothing in the operations definition removes weekends"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-x-calendar","type":"single","prompt":"The board report gives on-time for Rabi al-Thani 1448; operations gives it for September 2026. Before comparing the two numbers, what must the reconciliation state?","options":[{"key":"A","text":"That the two periods cover different days, so one must be restated in the other calendar"},{"key":"B","text":"Nothing: both are about a month"},{"key":"C","text":"That the Hijri month is always shorter"},{"key":"D","text":"That the board report is wrong"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A Hijri month and a Gregorian month overlap only in part; the comparison is fair only on the same days.","misconceptions":["","Two \"months\" in different calendars are different periods","Hijri months have 29 or 30 days, and the length is not the issue","A different period does not make a report wrong; it makes it a different figure"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-x-mix-first","type":"single","prompt":"The network on-time rate rose from August to September while every route type got less punctual. What do you check first?","options":[{"key":"A","text":"Whether the data for August is complete"},{"key":"B","text":"The punctuality of each driver"},{"key":"C","text":"Whether the target changed"},{"key":"D","text":"How the number of trips of each route type changed between the two months"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"When every part falls and the total rises, the weights changed: here express trips doubled and trunk trips were cut.","misconceptions":["Incomplete data would not make every type fall while the total rises","Drivers are below the level at which the paradox happens","A target does not change the measured rate",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-x-confirm-definition","type":"single","prompt":"A network pack shows a 17% drop in weekly ridership. Before drilling down, which check comes first?","options":[{"key":"A","text":"Which depot fell most"},{"key":"B","text":"Whether the pack's count is the governed metric, and whether another count of the same taps agrees"},{"key":"C","text":"Last year's figure for the same week"},{"key":"D","text":"The weather of that week"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Confirming the measure first avoids investigating a change that exists only in one way of counting.","misconceptions":["Drilling before confirming may chase an artefact of the count","","Last year differs for many reasons and does not confirm this week's figure","Weather explains demand only once the drop is shown to be real"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"}]}</script>
